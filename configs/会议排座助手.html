<header><div><h1>会议排座助手</h1><small>会场平面编辑 · 本地离线工作台</small></div><div class="tools"><button id="undo">撤销</button><button id="redo">重做</button><button id="save">导出方案</button><button id="load">导入方案</button><button id="csv">导出名单</button><button class="primary" id="print">打印 / PDF</button><input type="file" id="file" accept=".json,application/json" class="hidden"></div></header>
<div class="workspace"><aside class="panel"><section class="section"><h2>01　会议资料</h2><label class="label" for="meeting">会议名称</label><input id="meeting" maxlength="100"><label class="label" for="subtitle">日期 / 地点 / 备注</label><input id="subtitle" maxlength="120"><div class="flex" style="margin-top:9px"><select id="paper" aria-label="打印方向"><option value="landscape">A4 横向</option><option value="portrait">A4 纵向</option></select><label class="checkline"><input type="checkbox" id="mono">黑白打印</label></div><label class="checkline" style="margin-top:8px"><input type="checkbox" id="numbers">显示座位编号</label></section>
<section class="section"><h2>02　座位布局</h2><div class="muted">点击排名称可改名；数量可直接输入（0–24）。</div><div id="rows"></div><div class="flex" style="margin-top:8px"><select id="newZone" class="grow" aria-label="新增排位置"><option value="rear">后方长桌</option><option value="right">右侧外围</option><option value="left">左侧外围</option></select><button id="addRow">＋新增排</button></div></section>
<section class="section"><h2>03　座位编辑</h2><div id="selectedInfo" class="selectedInfo">点击图中的座位开始编辑</div><div class="flex"><input id="person" class="grow" placeholder="输入姓名，Enter 保存并跳下一座" maxlength="40" disabled><button id="apply" disabled>确认</button></div><div class="flex" style="margin-top:6px"><button id="prev" class="grow" disabled>上一座</button><button id="next" class="grow" disabled>下一座</button><button id="clearSeat" disabled>清空</button></div><div class="flex" style="margin-top:7px"><button id="swap" class="grow" disabled>与另一座互换</button></div><div class="muted" style="margin-top:5px">也可在图中拖动座位实现换座（含空位）。</div></section>
<section class="section"><h2>04　批量排座</h2><textarea id="bulk" rows="4" placeholder="粘贴名单，每行一人；也支持逗号、顿号、Tab 分隔"></textarea><select id="bulkScope" style="margin-top:6px" aria-label="批量填充范围"></select><div class="flex" style="margin-top:6px"><button id="bulkFill" class="primary grow">依次填入空座</button><button id="clearAll" class="danger">清空名单</button></div><div class="muted" style="margin-top:5px">保留已排座位；超出容量的姓名留在输入框。</div></section>
<section class="section"><h2>05　查找与参考</h2><input id="search" placeholder="搜索姓名或座位编号"><div id="results"></div><div class="flex" style="margin-top:8px"><button id="reset" class="danger grow">恢复初始布局</button></div><p class="muted" id="storage">自动保存在当前浏览器</p><details><summary>查看会场原始照片</summary><div class="photos"><a href="#" id="photoA"><img id="imgA" alt="会场角度一"></a><a href="#" id="photoB"><img id="imgB" alt="会场角度二"></a></div><p class="muted">初始座位数及门位置为照片推定，可按实地调整。</p></details></section></aside>
<main class="stage"><div class="stagebar"><div class="stats"><div class="stat"><b id="total">0</b><span>总座位</span></div><div class="stat"><b id="used">0</b><span>已安排</span></div><div class="stat"><b id="empty">0</b><span>空座</span></div></div><div class="flex"><label class="checkline"><input type="checkbox" id="flip">左右镜像</label><button id="zoomOut">－</button><button id="zoomIn">＋</button><button id="fit">适应</button></div></div><div class="stagebody"><div class="sheet" id="sheet"><div class="sheethead"><h2 id="sheetTitle"></h2><div id="sheetSub"></div></div><div class="mapwrap" id="mapwrap"><svg id="map" role="img" aria-label="交互式会议会场平面图" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"></svg></div><div class="legend"><span><i class="swatch assignedsw"></i>已安排</span><span><i class="swatch"></i>空座</span><span class="selectedlegend"><i class="swatch selectedsw"></i>当前选中</span></div><div class="sheetfoot"><span id="sheetCount"></span><span>显示屏方向为会场正前方</span></div></div></div><div class="notice" id="notice" aria-live="polite">点击任意座位录入姓名；拖动可交换座位。</div></main></div>
